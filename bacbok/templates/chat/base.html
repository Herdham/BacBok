<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <style>
        :root {
            /* Light theme as default */
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --primary: #6C5CE7;
            --primary-light: #7c6df0;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --text-primary: #1a1a2e;
            --text-secondary: #65676b;
            --text-muted: #8a8d91;
            --border: rgba(0,0,0,0.1);
            --gradient-1: linear-gradient(135deg, #6C5CE7 0%, #00cec9 100%);
            --gradient-2: linear-gradient(135deg, #fd79a8 0%, #6C5CE7 100%);
            --shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0e27;
            --bg-secondary: #131842;
            --bg-card: rgba(19, 24, 66, 0.6);
            --primary: #6C5CE7;
            --primary-light: #a29bfe;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --text-primary: #ffffff;
            --text-secondary: #a0a3b1;
            --text-muted: #6c6f85;
            --border: rgba(108, 92, 231, 0.2);
            --gradient-1: linear-gradient(135deg, #6C5CE7 0%, #00cec9 100%);
            --gradient-2: linear-gradient(135deg, #fd79a8 0%, #6C5CE7 100%);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    </style>
    <!-- initialize stored theme early to avoid FOUC -->
    <script> (function(){ try{ var t=localStorage.getItem('bacbok_theme'); if(t) document.documentElement.setAttribute('data-theme', t);}catch(e){} })(); </script>
    {% block head %}{% endblock %}
</head>
<body>
    <button id="themeToggleBtn" aria-pressed="false" aria-label="Toggle theme" style="position:fixed;right:12px;bottom:12px;z-index:9999;border-radius:999px;padding:8px 10px;border:none;background:rgba(255,255,255,0.03);color:inherit;backdrop-filter:blur(6px);">🌓</button>
    <script src="{% static 'js/theme-toggle.js' %}"></script>
    <script> (function(){ if(window.bacbokTheme){ window.bacbokTheme.initTheme(); var btn=document.getElementById('themeToggleBtn'); if(btn){ btn.addEventListener('click', function(){ window.bacbokTheme.toggleTheme(); }); var cur=document.documentElement.getAttribute('data-theme')||'dark'; btn.setAttribute('aria-pressed', cur==='dark'); } }})();</script>
    <div class="container">
        {% block content %}

        {% endblock %}
</body>
</html>
